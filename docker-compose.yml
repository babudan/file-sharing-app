services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fileshare
      POSTGRES_PASSWORD: fileshare
      POSTGRES_DB: fileshare
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fileshare -d fileshare"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  api:
    build:
      context: ./api
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://fileshare:fileshare@db:5432/fileshare
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      COOKIE_SECURE: "false"
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: fileshare
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
      CORS_ORIGIN: http://localhost:8080
      PUBLIC_APP_URL: http://localhost:8080
      MAX_FILE_BYTES: "26214400"
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-Ledger}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "3000"

  web:
    build:
      context: ./web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
